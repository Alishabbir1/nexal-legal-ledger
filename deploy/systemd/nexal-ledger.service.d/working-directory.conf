# systemd drop-in: point nexal-ledger at the git clone on the VPS.
# Install on VPS:
#   sudo mkdir -p /etc/systemd/system/nexal-ledger.service.d
#   sudo cp deploy/systemd/nexal-ledger.service.d/working-directory.conf \
#       /etc/systemd/system/nexal-ledger.service.d/
#   sudo systemctl daemon-reload
#   sudo systemctl restart nexal-ledger
#
# Or run: bash scripts/fix_ledger_working_directory.sh

[Service]
WorkingDirectory=/root/nexal-legal-ledger
